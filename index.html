    <style>
        body {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-header-clickable {
             cursor: pointer;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .progress-bar {
            transition: width 0.8s ease-in-out;
        }
        
        .question-type-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 1px solid #e2e8f0;
        }

        .details-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.7s ease-out, padding 0.5s ease-out;
            padding-top: 0;
            padding-bottom: 0;
        }

        .details-content.open {
            max-height: 2000px; /* Adjust as needed for content */
            padding-top: 1.5rem; /* 24px */
            padding-bottom: 1.5rem; /* 24px */
        }
        
        .chevron {
            transition: transform 0.3s ease;
        }
        
        .chevron.open {
            transform: rotate(90deg);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .option-btn {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-btn.selected {
            font-weight: 600;
        }
        .option-btn.correct {
            border-color: #22c55e;
            background-color: #f0fdf4;
        }
        .option-btn.incorrect {
            border-color: #ef4444;
            background-color: #fef2f2;
        }
    </style>

                        { question: "The Earth's climate has always been in a state of flux. (17)----, the current rate of change is unprecedented. Scientists believe that this rapid warming is largely (18)---- by human activities.", options: ["(17) A) However", "B) Therefore", "C) For example", "D) In other words", "E) Similarly"], answer: "A", explanation: "İlk cümle iklimin her zaman değiştiğini, ikinci cümle ise 'şu anki değişim oranının emsalsiz olduğunu' söylüyor. Bu iki ifade arasında bir zıtlık vardır. Bu zıtlığı en iyi 'However' (Ancak) bağlacı kurar." },

                    examples: [

                        { question: "Hükümetin yeni ekonomik politikaları uygulamaya başlamasından bu yana küçük işletmeler pek çok zorlukla karşılaştı.", options: ["A) Small businesses have faced many challenges since the government started to implement new economic policies.", "B) The government started to implement new economic policies because small businesses faced many challenges.", "C) Many challenges were faced by small businesses after the government implemented new economic policies.", "D) If the government implements new economic policies, small businesses will face many challenges.", "E) The new economic policies implemented by the government have challenged many small businesses."], answer: "A", explanation: "Türkçe cümlenin ana yüklemi 'karşılaştı' ve '-den bu yana' (since) bağlacı kullanılmıştır. Bu yapı İngilizce'de en iyi Present Perfect Tense ('have faced') ile karşılanır. A şıkkı, hem zaman yapısını hem de 'since' ile başlayan yan cümleyi doğru bir şekilde kurmuştur." }

                    examples: [
                        { question: "<b>Paragraf:</b> The world's oceans are facing a dual threat from climate change: warming waters and ocean acidification. As the atmosphere warms, the oceans absorb a significant amount of this excess heat, leading to rising sea temperatures. This warming can cause coral bleaching and disrupt marine ecosystems. Simultaneously, about a quarter of the carbon dioxide (CO2) released by human activities is absorbed by the oceans. When CO2 dissolves in seawater, it forms carbonic acid, which lowers the ocean's pH, a process known as acidification. This makes it more difficult for marine organisms like corals and shellfish to build their skeletons and shells.<br><br><b>Soru:</b> The passage is mainly concerned with ----.", options: ["A) the process of coral bleaching", "B) the chemical composition of seawater", "C) the two primary ways climate change affects oceans", "D) the role of shellfish in marine ecosystems", "E) human activities that release carbon dioxide"], answer: "C", explanation: "Paragraf, iklim değişikliğinin okyanusları etkilediği iki ana tehdidi - suların ısınması (warming waters) ve okyanus asitlenmesi (ocean acidification) - açıklamaktadır. Bu nedenle metnin ana konusu C seçeneğidir." },
                        { question: "<b>Paragraf:</b> (Yukarıdaki metinle aynı)<br><br><b>Soru:</b> According to the passage, ocean acidification makes it harder for some marine creatures to ----.", options: ["A) absorb excess heat from the atmosphere", "B) find food in warmer waters", "C) adapt to lower oxygen levels", "D) form their protective outer layers", "E) dissolve carbon dioxide in seawater"], answer: "D", explanation: "Metinde açıkça 'This makes it more difficult for marine organisms like corals and shellfish to build their skeletons and shells' ifadesi geçmektedir. 'Skeletons and shells' (iskeletler ve kabuklar), bu canlıların 'koruyucu dış katmanları' ('protective outer layers') olarak ifade edilebilir." }
                    ]
                }
            },
            // 7. Diyalog Tamamlama
            {
                type: "Diyalog Tamamlama",
                questions: "63-67", count: 5, weight: 6.25, color: "bg-pink-500", lightColor: "bg-pink-50", textColor: "text-pink-600", icon: "💬",
                details: {

                    strategies: ["Boşluktan hemen önceki ve hemen sonraki cümlelere odaklanın.", "Boşluktan sonraki cümle bir cevap ise, boşluğun bir soru olması muhtemeldir.", "Konuşmanın akışını ve bağlamını anlayın."],
                    examples: [
                        { question: "Clara: I'm thinking of adopting a pet. \nMark: That's great! Have you thought about what kind? \nClara: Not really. I like both cats and dogs. \nMark: ---- \nClara: That's a good point. I should probably consider that.", options: ["A) Dogs are definitely more loyal than cats.", "B) I think you should get a fish instead.", "C) Well, your choice should depend on your lifestyle. Dogs need more attention and walks.", "D) It doesn't really matter which one you choose.", "E) I think we should go to another city for a pet."], answer: "C", explanation: "Clara kararsız olduğunu belirttikten sonra, Mark'ın cevabına 'Bu iyi bir nokta' diyerek katılıyor. Bu, Mark'ın mantıklı bir karşılaştırma veya tavsiye sunduğunu gösterir. C şıkkı, Clara'nın kararını 'yaşam tarzına' dayandırması gerektiğini söyleyerek tam da bu işlevi yerine getirir." },
                        { question: "Patient: I've been having trouble sleeping lately. \nDoctor: I see. ---- \nPatient: No, I usually drink a cup of herbal tea before bed. \nDoctor: Okay, let's look at some other potential causes then.", options: ["A) Have you been under a lot of stress?", "B) Do you consume any caffeine in the evening?", "C) How many hours do you sleep?", "D) You should try taking some medication.", "E) Did you eat anything unusual yesterday?"], answer: "B", explanation: "Hastanın 'Hayır, genellikle yatmadan önce bitki çayı içerim.' cevabı, doktorun uykusuzluğa neden olabilecek bir içecekle ilgili soru sorduğunu gösterir. Bu bağlamda en mantıklı soru, akşamları kafein tüketip tüketmediğidir." }

                        { question: "Unless you have prior experience, you are not eligible for this position.", options: ["A) You can apply for this position only if you have previous experience.", "B) Even with prior experience, you might not be suitable for this position.", "C) This position is not open to anyone, regardless of their experience.", "D) You are eligible for this position because you don't have experience.", "E) Having prior experience is an advantage for this position, but not a requirement."], answer: "A", explanation: "'Unless you have...' (-e sahip olmadıkça) yapısı, bir koşul belirtir. Bu ifadenin anlamca en yakın karşılığı 'only if you have...' (-e sadece sahipsen) yapısıdır." }

                    examples: [
                        { question: "(I) The development of agriculture was a turning point in human history. (II) It allowed people to settle in one place and form permanent communities. (III) These communities eventually grew into towns and cities. (IV) Hunting and gathering required a nomadic lifestyle. (V) This shift led to the development of new social structures and technologies.", options: ["A) I", "B) II", "C) III", "D) IV", "E) V"], answer: "D", explanation: "Paragraf, 'tarımın gelişiminin' sonuçlarını anlatmaktadır (yerleşik hayat, şehirler, yeni teknolojiler). IV. cümle ise tarımdan önceki 'avcılık ve toplayıcılık' dönemine ait bir bilgi vererek konunun dışına çıkmakta ve anlam akışını bozmaktadır." },
                        { question: "(I) The Great Wall of China is one of the most impressive architectural feats in history. (II) It stretches for thousands of kilometers across northern China. (III) The wall was built to protect Chinese states against raids and invasions. (IV) Beijing is the modern capital of China and a major tourist destination. (V) Construction on the earliest sections of the wall began as early as the 7th century BC.", options: ["A) I", "B) II", "C) III", "D) IV", "E) V"], answer: "D", explanation: "Paragrafın konusu tamamen Çin Seddi'dir (uzunluğu, amacı, yapılış tarihi). IV. cümle ise Çin'in modern başkenti Pekin hakkında alakasız bir bilgi vererek paragrafın odağını bozmaktadır." }
                    ]
                }
            }
        ];

        function generateQuestionCards() {
            const grid = document.getElementById('questionGrid');
            
            questionData.forEach((item, index) => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = `question-type-card rounded-xl card-hover animate-fade-in`;
                cardWrapper.style.animationDelay = `${index * 0.05}s`;
                
                let examplesHtml = item.details.examples.map((ex, exIndex) => {
                    const uniqueId = `ex-${index}-${exIndex}`;
                    return `
                    <div class="mt-6 border-t pt-4">
                        <p class="font-semibold text-gray-700 mb-3">Örnek Soru ${exIndex + 1}:</p>
                        <div class="bg-gray-100 p-3 rounded-md text-gray-800">${ex.question}</div>
                        <div id="options-${uniqueId}" class="mt-3 space-y-2">
                            ${ex.options.map((opt, optIndex) => `<div class="p-2 border rounded-md hover:bg-gray-50 option-btn" data-ex-id="${uniqueId}" data-opt-index="${optIndex}">${opt}</div>`).join('')}
                        </div>
                        <div id="result-${uniqueId}" class="mt-3"></div>
                    </div>
                `}).join('');

                cardWrapper.innerHTML = `
                    <div class="p-6 card-header-clickable">
                         <div class="flex items-center justify-between mb-4">
                            <div class="text-3xl">${item.icon}</div>
                            <div class="flex items-center space-x-2">
                                <div class="${item.lightColor} ${item.textColor} px-3 py-1 rounded-full text-sm font-semibold">
                                    %${item.weight}
                                </div>
                                <svg class="chevron w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 mb-1">${item.type}</h3>
                        <p class="text-sm text-gray-500">Sorular: ${item.questions}</p>
                         <div class="w-full bg-gray-200 rounded-full h-2 mt-4">
                            <div class="${item.color} h-2 rounded-full progress-bar" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="details-content bg-white px-6 border-t">
                        <div>
                            <h4 class="text-md font-bold text-gray-800 mb-3">🗝️ Çalışılması Gereken Konular</h4>
                            <div class="flex flex-wrap gap-2 text-sm">
                                ${item.details.background_info.map(b => `<span class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-medium">${b}</span>`).join('')}
                            </div>
                        </div>
                        <div class="mt-6 border-t pt-4">
                            <h4 class="text-md font-bold text-gray-800 mb-3">⭐ Çözüm Stratejileri</h4>
                            <ul class="list-disc list-inside space-y-2 text-sm text-gray-600">
                                ${item.details.strategies.map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>
                        ${examplesHtml}
                    </div>
                `;
                
                grid.appendChild(cardWrapper);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            generateQuestionCards();

            const grid = document.getElementById('questionGrid');

            grid.addEventListener('click', (event) => {
                const cardHeader = event.target.closest('.card-header-clickable');
                const optionBtn = event.target.closest('.option-btn');

                if (cardHeader) {
                    const cardWrapper = cardHeader.parentElement;
                    const details = cardWrapper.querySelector('.details-content');
                    const chevron = cardHeader.querySelector('.chevron');

                    if (details) {
                        const isOpen = details.classList.contains('open');

                        document.querySelectorAll('.details-content.open').forEach(openContent => {
                            if (openContent !== details) {
                                openContent.classList.remove('open');
                                const otherChevron = openContent.parentElement.querySelector('.chevron');
                                if(otherChevron) otherChevron.classList.remove('open');
                            }
                        });

                        if (!isOpen) {
                            details.classList.add('open');
                            if(chevron) chevron.classList.add('open');
                        } else {
                            details.classList.remove('open');
                            if(chevron) chevron.classList.remove('open');
                        }
                    }
                }
                
                if (optionBtn) {
                    const exId = optionBtn.dataset.exId;
                    const [cardIndex, exIndex] = exId.split('-').slice(1).map(Number);
                    const selectedOptIndex = parseInt(optionBtn.dataset.optIndex);
                    
                    const example = questionData[cardIndex].details.examples[exIndex];
                    const correctAnswerLetter = example.answer;
                    const selectedAnswerLetter = String.fromCharCode(65 + selectedOptIndex);

                    const optionsContainer = document.getElementById(`options-${exId}`);
                    const resultContainer = document.getElementById(`result-${exId}`);

                    Array.from(optionsContainer.children).forEach((optDiv, index) => {
                        const currentOptLetter = String.fromCharCode(65 + index);
                        optDiv.classList.remove('selected', 'correct', 'incorrect');
                        if (currentOptLetter === correctAnswerLetter) {
                            optDiv.classList.add('correct');
                        }
                    });

                    optionBtn.classList.add('selected');
                     if (selectedAnswerLetter !== correctAnswerLetter) {
                        optionBtn.classList.add('incorrect');
                    }


                    resultContainer.innerHTML = `
                        <div class="mt-3 p-3 ${selectedAnswerLetter === correctAnswerLetter ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} rounded-md">
                            <p class="font-bold ${selectedAnswerLetter === correctAnswerLetter ? 'text-green-800' : 'text-red-800'}">
                                ${selectedAnswerLetter === correctAnswerLetter ? 'Doğru!' : 'Yanlış.'} Doğru Cevap: ${correctAnswerLetter}
                            </p>
                            <p class="text-sm ${selectedAnswerLetter === correctAnswerLetter ? 'text-green-700' : 'text-red-700'} mt-2">${example.explanation}</p>
                        </div>
                    `;
                }
            });

            setTimeout(() => {
                const progressBars = document.querySelectorAll('.progress-bar');
                progressBars.forEach((bar, index) => {
                    const item = questionData[index];
                    if (item) {
                       bar.style.width = `${item.weight}%`;
                    }
                });
            }, 500);
        });
    </script>
</body>
</html>
